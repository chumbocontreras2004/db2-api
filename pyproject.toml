[project]
name = "db2-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Name", email = "chumbocontreras@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "ibm-db>=3.3.0",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.4",
    "pywebview>=6.2.1",
    "streamlit>=1.66.0",
]

[project.scripts]
db2-api = "db2_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
